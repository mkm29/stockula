---
name: Roam Code Analysis
on:
  pull_request:
    branches: [main, master, develop]
permissions:
  contents: read
  pull-requests: write
jobs:
  roam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install roam-code
      - name: Index codebase
        run: roam index
      - name: Run fitness checks
        run: roam fitness
      - name: Run PR risk analysis (informational)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: roam pr-risk "origin/${BASE_REF}..HEAD" || true
